name: pune_explorer
description: "PuneExplorer - Modern Pune travel, Sahyadri fort trekking, Pune Darshan booking, and exploration platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  uuid: ^4.4.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6
  crypto: ^3.0.3
  flutter_staggered_grid_view: ^0.7.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
